<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141416" />
    <!-- 파비콘: SVG를 지원하는 브라우저는 SVG, 아니면 32px PNG. 아이폰 홈 화면은 180px PNG -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 폰트 CDN에 미리 연결해 두기 (DNS·TLS 연결 시간을 아껴서 글자가 더 빨리 뜸) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>프론트엔드 | 모경태</title>
    <meta
      name="description"
      content="디테일을 중요시 여기는 5년차 프론트엔드 개발자 모경태의 경력과 프로젝트를 소개합니다."
    />

    <!-- 링크 미리보기(OG): 카카오톡·슬랙·링크드인 등에 링크를 붙였을 때 보이는 정보 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="모경태" />
    <meta property="og:title" content="프론트엔드 | 모경태" />
    <meta
      property="og:description"
      content="디테일을 중요시 여기는 5년차 프론트엔드 개발자 모경태의 경력과 프로젝트를 소개합니다."
    />
    <meta property="og:url" content="https://kanggu7.com/" />
    <!--
      og:image는 반드시 https://로 시작하는 전체 주소여야 미리보기에 이미지가 떠요. (1200×630)
      이미지 원본: assets-src/og/og.html (로컬 보관) → Edge headless 스크린샷으로 public/og.png 생성
      이미지를 바꾸면 카카오톡은 캐시가 남아 있으니 "카카오 공유 디버거"에서 캐시를 지워야 새 이미지가 보여요.
    -->
    <meta property="og:image" content="https://kanggu7.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="모경태 — 디테일을 중요시 여기는 5년차 프론트엔드 개발자" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 검색엔진에 이 페이지의 대표 주소를 알려줌 (www/비www 중복 방지) -->
    <link rel="canonical" href="https://kanggu7.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
