<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141416" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>프론트엔드 | 모경태</title>
    <meta
      name="description"
      content="디테일을 중요시 여기는 5년차 프론트엔드 개발자 모경태의 경력과 프로젝트를 소개합니다."
    />

    <!-- 링크 미리보기(OG): 카카오톡·슬랙·링크드인 등에 링크를 붙였을 때 보이는 정보 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="모경태" />
    <meta property="og:title" content="프론트엔드 | 모경태" />
    <meta
      property="og:description"
      content="디테일을 중요시 여기는 5년차 프론트엔드 개발자 모경태의 경력과 프로젝트를 소개합니다."
    />
    <meta name="twitter:card" content="summary" />
    <!--
      도메인이 정해지면 아래 두 줄의 주석을 풀고 주소를 바꾸세요.
      og:image는 반드시 https://로 시작하는 전체 주소여야 미리보기에 이미지가 떠요. (권장 1200×630)
      이미지를 넣으면 위 twitter:card를 "summary_large_image"로 바꾸면 크게 보여요.
    -->
    <!-- <meta property="og:url" content="https://도메인/" /> -->
    <!-- <meta property="og:image" content="https://도메인/og.png" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
